<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Movie Vault</title>
    <link href="SimpleStyle.css" rel="stylesheet" />
    <script>
        const uri = 'http://localhost:8080';

        document.addEventListener('DOMContentLoaded', function () {

            fetch(uri + "/videos")

                .then(response => response.json())
                .then(data => {

                    var select = document.getElementById('movielist');

                    for (var i = 0; i < data.length; i++) {
                        var opt = document.createElement('option');
                        opt.value = data[i].id;
                        opt.innerHTML = data[i].title;
                        select.appendChild(opt);
                    }
                })
                .catch(error => console.error('Unable to get movies.', error));


            document.getElementById("btnWatchMovie").onclick = (event) => {
                var selectList = document.getElementById("movielist");
                var movieId = selectList.value;
                document.getElementById("videoPlayer").src = uri + "/video/" + movieId;
            }

        });


    </script>
</head>
<body>


    <div class="container">
        <div class="itemSpan2">
            <H1>The video vault</H1>
        </div>
        <div>
            <select id="movielist"></select>
        </div>
        <div>
            <button class="button button1" id="btnWatchMovie">Watch movie</button>
        </div>
        <div class="itemSpan2">
            <video id="videoPlayer" width="650" autoplay controls>
                <source type="video/mp4" />
            </video>
        </div>
    </div>
</body>
</html>
